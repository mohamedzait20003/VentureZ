# Local dev stack.
# Before `up`:
#   1) generate identity-engine's RS256 keypair into services/identity-engine/keys/
#      (jwt_private.pem + jwt_public.pem)
#   2) apply migrations:  make migrate-up   (postgres is exposed on :5432)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: venturez
      POSTGRES_PASSWORD: venturez
      POSTGRES_DB: venturez
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venturez -d venturez"]
      interval: 5s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports: ["16686:16686", "4317:4317"] # UI at http://localhost:16686

  identity-engine:
    build:
      context: . # root context: this module references ../../gen/go via replace
      dockerfile: services/identity-engine/Dockerfile
    environment:
      GRPC_ADDR: ":50053"
      DATABASE_URL: postgres://venturez:venturez@postgres:5432/venturez?sslmode=disable
      JWT_PRIVATE_KEY_PATH: /keys/jwt_private.pem
      JWT_ISSUER: venturez-identity
      APP_BASE_URL: http://localhost:3000
      # SMTP optional — empty host => emails are logged, not sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-VentureZ <no-reply@venturez.dev>}
    volumes:
      - ./services/identity-engine/keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: . # root context: this module references ../../gen/go via replace
      dockerfile: services/api-gateway/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem # identity's PUBLIC key only
      IDENTITY_ADDR: identity-engine:50053
      COOKIE_SECURE: "false" # true behind TLS in prod
      RATE_LIMIT_PER_MIN: "60"
    volumes:
      - ./services/identity-engine/keys:/keys:ro
    ports: ["8080:8080"]
    depends_on: [identity-engine]

  financial-engine:
    build: ./services/financial-engine
    environment:
      DATABASE_URL: postgres://venturez:venturez@postgres:5432/venturez?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy

  # agent: not implemented yet (no services/agent). Add when the Python service
  # exists; it will build from ./services/agent and dial financial-engine:50051.

volumes:
  pgdata:
