syntax = "proto3";

package identity.v1;

option go_package = "github.com/venturez/backend/gen/go/identity/v1;identityv1";

// Identity issues tokens (RS256 access JWT + rotating refresh token) and owns
// users, sessions and user_tokens. The api-gateway verifies tokens with the
// public key; it never mints them.
service Identity {
  rpc Register(RegisterRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc Refresh(RefreshRequest) returns (AuthResponse);
  rpc Logout(LogoutRequest) returns (SimpleResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (SimpleResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (SimpleResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (SimpleResponse);
}

message DeviceInfo {
  string user_agent  = 1;
  string ip_address  = 2;
  string device_name = 3;
}

message User {
  string id             = 1;
  string email          = 2;
  string username       = 3;
  string first_name     = 4;
  string last_name      = 5;
  string role           = 6;
  bool   email_verified = 7;
}

message AuthResponse {
  string access_token  = 1;  // short-lived RS256 JWT
  string refresh_token = 2;  // opaque; the gateway sets it as an HttpOnly cookie
  int64  expires_in    = 3;  // access-token TTL in seconds
  User   user          = 4;
}

message RegisterRequest {
  string email      = 1;
  string username   = 2;
  string first_name = 3;
  string last_name  = 4;
  string password   = 5;
  DeviceInfo device = 6;
}

message LoginRequest {
  string identifier = 1;  // email OR username
  string password   = 2;
  DeviceInfo device = 3;
}

message RefreshRequest {
  string refresh_token = 1;
  DeviceInfo device    = 2;
}

message LogoutRequest                { string refresh_token = 1; }
message RequestPasswordResetRequest  { string email = 1; }
message ResetPasswordRequest         { string token = 1; string new_password = 2; }
message VerifyEmailRequest           { string token = 1; }
message SimpleResponse               { bool success = 1; }
